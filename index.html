<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>API de Receitas</title>
  <link rel="stylesheet" href="style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">

</head>

<body>
  <h1>API para busca de Receitas</h1>

  <input type="text" id="busca" placeholder="Digite o nome da receita em inglês:" />
  <button id="botao-buscar">Buscar</button>

  <div id="carregando">Carregando...</div>
  <div id="info-cache"></div>
  <ul id="lista-resultados"></ul>
  <div class="paginacao">
    <button id="anterior">Anterior</button>
    <span id="info-pagina"></span>
    <button id="proximo">Próximo</button>
  </div>

  <!--carrega o arquivo JavaScript chamado "main.js", "type='module'" permite que o arquivo use importações e exportações (import/export),
  facilitando a separação do código em vários arquivos menores e mais organizados-->
  <script type="module" src="main.js"></script>
</body>
</html>
